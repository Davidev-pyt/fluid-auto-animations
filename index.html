<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">    
    <title>FP - Sellection</title>
</head>
<body>
    <header>
    <img src="img/logo.png" alt="logo FP">
    <nav>
        <ul>
            <li>Home</li>
            <li>Carros</li>
            <li>Fale Conosco</li>
        </ul>
    </nav>
    </header>

    <section>
        <div class="list">
            <div class="item">
                <div class="car-image">
                    <img src="img/car1.png" alt="Carro">
                </div>
                <div class="content">
                    <p class="car-information">Único Dono</p>
                    <h2>Ferrari</h2>
                    <p class="description">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod.
                    </p>
                    <button class="information">
                        Saiba Mais
                    </button>
                </div>
            </div>
        </div>

        <div class="arrows">
            <button><img src="img/arrow.png" alt="seta esquerda"></button>
            <button><img src="img/arrow.png" alt="seta direita"></button>
        </div>

        <div class="indicators">
            <div class="number">01</div>
            <ul>
                <li class="active"></li>
                <li></li>
                <li></li>
            </ul>

        </div>
    </section>
    
</body>
</html>
